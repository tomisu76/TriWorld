[project]
name = "triworld"
version = "0.1.0"
description = "One-click BeamNG map studio"
authors = [{name = "TriWorld Team"}]
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.9.0",
    "structlog>=24.1.0",
    
    # Geospatial
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    
    # Network/OSM
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    
    # Mesh/Geometry
    "trimesh>=4.0.0",
    "networkx>=3.2.0",
    
    # Image processing
    "pillow>=10.0.0",
    
    # Testing
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.90.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["triworld*"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["SIM102", "SIM103"]
fixable = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: fast unit tests",
    "property: hypothesis property tests",
    "integration: integration tests requiring SUMO/BeamNG",
    "slow: slow tests",
    "gpu: tests requiring GPU",
]

[tool.coverage.run]
source = ["packages"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]